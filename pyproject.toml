[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intervalnets"
version = "0.1.0"
description = "Interval arithmetic for linear PyTorch networks with outward rounding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Moritz Maibaum" },
  { name = "Philipp Petersen" },
]
keywords = [
  "interval-arithmetic",
  "neural-networks",
  "pytorch",
  "verified-computing",
  "certified-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/pcpet/intervalNets"
Repository = "https://github.com/pcpet/intervalNets"
Issues = "https://github.com/pcpet/intervalNets/issues"
Documentation = "https://github.com/pcpet/intervalNets#readme"

[project.optional-dependencies]
torch = [
  "torch>=2.0",
  "numpy>=1.24",
]
dev = [
  "pytest>=8.0",
  "nbformat>=5.10",
  "build>=1.2",
  "twine>=5.0",
  "numpy>=1.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
