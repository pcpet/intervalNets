[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intervalnets"
version = "0.1.0"
description = "Interval arithmetic for linear PyTorch networks with outward rounding"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Moritz Maibaum" },
  { name = "Philipp Petersen" },
]


[project.optional-dependencies]
torch = [
  "torch>=2.0",
]
dev = [
  "pytest>=8.0",
  "nbformat>=5.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
